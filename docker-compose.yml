services:
  postgres:
    image: postgres:16-alpine
    container_name: solvekar-postgres
    environment:
      POSTGRES_DB: solvekar
      POSTGRES_USER: solvekar
      POSTGRES_PASSWORD: solvekar_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvekar -d solvekar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
